<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聖德宮 - 線上祈福求籤系統</title>
    <style>
        body {
            background-color: #1a0202;
            color: #f7d070;
            font-family: "Microsoft JhengHei", sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: radial-gradient(circle, #4a0d0d 0%, #260505 100%);
            padding: 30px;
            border: 3px solid #f7d070;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(247, 208, 112, 0.3);
        }
        h1 {
            color: #ff3b3b;
            text-shadow: 2px 2px 4px #000;
        }
        .status-box {
            font-size: 1.2rem;
            margin: 20px 0;
            min-height: 40px;
            color: #fff;
        }
        .btn {
            background-color: #ff3b3b;
            color: #fff;
            border: 2px solid #f7d070;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .btn:hover {
            background-color: #f7d070;
            color: #260505;
            transform: scale(1.05);
        }
        .btn:disabled {
            background-color: #555;
            border-color: #777;
            color: #aaa;
            cursor: not-allowed;
        }
        /* 擲筊動畫效果 */
        .divine-box {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
            height: 100px;
        }
        .cup {
            width: 80px;
            height: 80px;
            background-color: #8b0000;
            border-radius: 80px 0 0 80px; /* 模擬凸面 */
            transform: rotate(45deg);
            transition: transform 0.5s ease-in-out;
            box-shadow: 3px 3px 5px rgba(0,0,0,0.5);
            display: inline-block;
        }
        .cup.flat {
            border-radius: 0 80px 80px 0; /* 模擬平面 */
            background-color: #d32f2f;
        }
        .jumping {
            animation: jump 0.5s ease-in-out 3;
        }
        @keyframes jump {
            0% { transform: translateY(0) rotate(45deg); }
            50% { transform: translateY(-50px) rotate(225deg); }
            100% { transform: translateY(0) rotate(405deg); }
        }
        .result-box {
            margin-top: 30px;
            padding: 20px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>⛩️ 聖德宮 線上求籤 ⛩️</h1>
    <p>請於心中默念您的姓名、出生年月日、住址以及祈求請示之事。</p>
    
    <div class="status-box" id="statusText">神明座前，請虔誠一拜後開始求籤...</div>
    
    <button class="btn" id="actionBtn" onclick="startDraw()">1. 虔誠抽籤</button>
    
    <div class="divine-box">
        <div id="cup1" class="cup"></div>
        <div id="cup2" class="cup"></div>
    </div>

    <div class="result-box" id="resultBox">
        <h2 style="color: #ff3b3b;" id="poemTitle"></h2>
        <p style="font-size: 1.3rem; letter-spacing: 2px;" id="poemContent"></p>
    </div>
</div>

<script>
    // 簡單的籤詩資料庫
    const drawPoems = [
        { title: "第一籤【大吉】", content: "福如東海壽如山，君爾何須嘆苦艱。命內自然逢大吉，茅屋因何變玉翻。" },
        { title: "第十二籤【上吉】", content: "長江風浪漸漸靜，于今得進可安寧。必有貴人相扶助，凶事脫出見太平。" },
        { title: "第二十四籤【中平】", content: "一年作事急如飛，君爾寬心莫遲疑。貴人更逢好事到，冷言冷語自消除。" },
        { title: "第三十六籤【下下】", content: "風水如兵涉險灘，思量好事總成難。如今且守舊因緣，免使狂風惹禍端。" }
    ];

    let currentStep = "draw"; // draw -> cast -> success
    let selectedPoem = null;

    function startDraw() {
        const statusText = document.getElementById('statusText');
        const actionBtn = document.getElementById('actionBtn');
        const resultBox = document.getElementById('resultBox');
        
        resultBox.style.display = "none";
        actionBtn.disabled = true;
        statusText.innerText = "🔮 正在為您搖晃籤筒，請稍候...";

        // 模擬搖籤筒時間
        setTimeout(() => {
            const randomIndex = Math.floor(Math.random() * drawPoems.length);
            selectedPoem = drawPoems[randomIndex];
            
            statusText.innerText = `恭喜求得：${selectedPoem.title}。接下來請向神明「擲筊」請示此籤是否正確？`;
            actionBtn.innerText = "2. 擲筊請示";
            actionBtn.disabled = false;
            actionBtn.setAttribute("onclick", "startCast()");
        }, 1500);
    }

    function startCast() {
        const statusText = document.getElementById('statusText');
        const actionBtn = document.getElementById('actionBtn');
        const cup1 = document.getElementById('cup1');
        const cup2 = document.getElementById('cup2');

        actionBtn.disabled = true;
        statusText.innerText = "💥 筊杯落地中...";
        
        // 加入跳動動畫
        cup1.classList.add('jumping');
        cup2.classList.add('jumping');

        setTimeout(() => {
            // 移除動畫以利下次使用
            cup1.classList.remove('jumping');
            cup2.classList.remove('jumping');

            // 隨機決定兩杯的正反面 (0 代表凸面，1 代表平面)
            const side1 = Math.floor(Math.random() * 2);
            const side2 = Math.floor(Math.random() * 2);

            // 根據結果改變視覺形狀
            if(side1 === 1) cup1.classList.add('flat'); else cup1.classList.remove('flat');
            if(side2 === 1) cup2.classList.add('flat'); else cup2.classList.remove('flat');

            // 判斷擲筊結果
            if (side1 !== side2) {
                // 聖筊 (一正一反)
                statusText.innerText = "🎉【聖筊】！神明應允了此籤。";
                document.getElementById('poemTitle').innerText = selectedPoem.title;
                document.getElementById('poemContent').innerText = selectedPoem.content;
                document.getElementById('resultBox').style.display = "block";
                
                // 重設按鈕
                actionBtn.innerText = "重新求籤";
                actionBtn.setAttribute("onclick", "resetSystem()");
            } else if (side1 === 0 && side2 === 0) {
                // 陰筊 (雙凸)
                statusText.innerText = "❌【陰筊】（神明生氣或不認同），請重新求取下一支籤。";
                actionBtn.innerText = "重新抽籤";
                actionBtn.setAttribute("onclick", "resetSystem()");
            } else {
                // 笑筊 (雙平)
                statusText.innerText = "😂【笑筊】（神明笑而不答，或事情未說清楚），請再擲筊一次。";
                actionBtn.innerText = "再次擲筊";
                actionBtn.setAttribute("onclick", "startCast()");
            }
            actionBtn.disabled = false;
        }, 1500);
    }

    function resetSystem() {
        document.getElementById('statusText').innerText = "神明座前，請虔誠一拜後開始求籤...";
        const actionBtn = document.getElementById('actionBtn');
        actionBtn.innerText = "1. 虔誠抽籤";
        actionBtn.setAttribute("onclick", "drawPoems");
        actionBtn.setAttribute("onclick", "startDraw()");
        document.getElementById('resultBox').style.display = "none";
        document.getElementById('cup1').classList.remove('flat');
        document.getElementById('cup2').classList.remove('flat');
    }
</script>

</body>
</html>
